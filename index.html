<html>
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
		<title>Minecraft</title>
		<link rel="shortcut icon" type="image/ico" href="https://www.minecraft.net/etc.clientlibs/minecraft/clientlibs/main/resources/favicon.ico">
	</head>
	<style>
    @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@500&display=swap');
		body {
			overflow: hidden; /* Hide scrollbars */
		}
		.world-select {
			width: 99vw;
			min-width: 300px;
			height: calc(100vh - 220px);
			position: absolute;
			bottom: 120px;
			overflow-y: auto;
			background-color: RGBA(0, 0, 0, 0.6);
			justify-content: center;
			margin: 0 auto;
		}
		.world {
			width: 250px;
			height: auto;
			border: 1px solid black;
			font-size: 18px;
			font-family: "Poppins", sans-serif;
			color: rgb(180, 180, 180);
			margin: 0 auto;
			margin-top: 15px;
			padding: 5px;
			cursor: pointer;
		}
		strong {
			color: white;
		}
		.selected {
			border: 3px solid white;
			padding: 3px;
		}
		input[type=text] {
			background-color: black;
			caret-color: white;
			border: 2px solid gray;
			color: white;
			font-size: 24px;
			padding-left: 12px;
		}
		input[type=text]:focus {
			border: 2px solid lightgray;
		}
		#boxcentertop {
			z-index: 1;
			width: 80vw;
			max-width: 400px;
			height: 50px;
			position: relative;
			top: 30px;
			display: block;
			margin: 0 auto;
		}
		.hidden {
			display: none !important;
		}
		#onhover {
			background-color: rgba(0, 0, 0, 0.9);
			color: rgb(200, 200, 200);
			font-family: 'Poppins', sans-serif;
			word-wrap: normal;
			width: auto;
			max-width: 400px;
			position: absolute;
			z-index: 1;
			padding: 10px;
			cursor: default;
		}
		#quota {
			display: block;
			position: absolute;
			width: 99vw;
			margin: 0 auto;
			bottom: 110px;
			z-index: 1;
			background-color: RGBA(0, 0, 0, 0.6);
			justify-content: center;
			text-align: center;
			color: white;
      font-family: 'Poppins', sans-serif;
		}
		/* ==== Touch controls (Bedrock style) ==== */
		#overlay {
			touch-action: none;
		}
		#touch-ui {
			position: fixed;
			inset: 0;
			z-index: 5;
			pointer-events: none;
		}
		.tctrl {
			pointer-events: auto;
			touch-action: none;
			-webkit-user-select: none;
			user-select: none;
			-webkit-tap-highlight-color: transparent;
		}
		#joystick-base {
			position: absolute;
			left: 20px;
			bottom: 88px;
			width: 140px;
			height: 140px;
			border-radius: 50%;
			background: rgba(255, 255, 255, 0.10);
			border: 2px solid rgba(255, 255, 255, 0.30);
		}
		#joystick-thumb {
			position: absolute;
			left: 50%;
			top: 50%;
			width: 54px;
			height: 54px;
			margin: -27px 0 0 -27px;
			border-radius: 50%;
			background: rgba(255, 255, 255, 0.35);
			border: 2px solid rgba(255, 255, 255, 0.55);
			transition: transform 0.05s linear;
		}
		.tbtn {
			position: absolute;
			border-radius: 50%;
			display: flex;
			align-items: center;
			justify-content: center;
			font-family: "Poppins", sans-serif;
			font-size: 11px;
			color: rgba(255, 255, 255, 0.85);
			background: rgba(255, 255, 255, 0.16);
			border: 2px solid rgba(255, 255, 255, 0.35);
		}
		.tbtn.pressed {
			background: rgba(255, 255, 255, 0.45);
			color: black;
		}
		#btn-jump {
			right: 28px;
			bottom: 96px;
			width: 64px;
			height: 64px;
		}
		#btn-sneak {
			right: 108px;
			bottom: 66px;
			width: 52px;
			height: 52px;
			font-size: 9px;
		}
		#btn-sprint {
			right: 176px;
			bottom: 116px;
			width: 52px;
			height: 52px;
			font-size: 9px;
		}
		#btn-attack {
			right: 44px;
			bottom: 196px;
			width: 68px;
			height: 68px;
		}
		#btn-place {
			right: 132px;
			bottom: 170px;
			width: 62px;
			height: 62px;
		}
		#touch-hotbar {
			position: absolute;
			bottom: 6px;
			left: 50%;
			transform: translateX(-50%);
			display: flex;
			gap: 4px;
		}
		.hot-slot {
			width: 38px;
			height: 38px;
			border: 2px solid rgba(255, 255, 255, 0.40);
			background: rgba(0, 0, 0, 0.35);
			color: rgba(255, 255, 255, 0.80);
			font-family: "Poppins", sans-serif;
			font-size: 14px;
			display: flex;
			align-items: center;
			justify-content: center;
		}
		.hot-slot.pressed {
			background: rgba(255, 255, 255, 0.45);
			color: black;
		}
	</style>
	<body>
	<canvas id="overlay" tabindex="0" width="600" height="600" style="position: absolute; top: 0px; left: 0px"></canvas>
	<input type="text" id="savebox" class="hidden" spellcheck="false" style="position: absolute; top: 10px; left: 10px; z-index: 1;">
	<input type="text" id="boxcentertop" class="hidden" spellcheck="false">
	<div id="quota" class="hidden"></div>
	<div id="onhover" class="hidden"></div>
	<p id="savedirections" class="hidden" style="position: absolute; top: 40px; left: 10px; z-index: 1; background-color: rgba(255, 255, 255, 0.3);">
		JSCRAFT!
	</p>
	<div class="world-select hidden" id="worlds"></div>
	<p id="message" class="hidden" style="position: absolute; top: 10px; right: 10px; z-index: 1; text-align: right; background-color: rgba(255, 255, 255, 0.3);"></p>
	<div id="touch-ui" class="hidden">
		<div id="joystick-base" class="tctrl">
			<div id="joystick-thumb"></div>
		</div>
		<div id="btn-sprint" class="tctrl tbtn">SPRINT</div>
		<div id="btn-sneak" class="tctrl tbtn">SNEAK</div>
		<div id="btn-jump" class="tctrl tbtn">JUMP</div>
		<div id="btn-attack" class="tctrl tbtn">BREAK</div>
		<div id="btn-place" class="tctrl tbtn">PLACE</div>
		<div id="touch-hotbar" class="tctrl">
			<div class="hot-slot" data-slot="1">1</div>
			<div class="hot-slot" data-slot="2">2</div>
			<div class="hot-slot" data-slot="3">3</div>
			<div class="hot-slot" data-slot="4">4</div>
			<div class="hot-slot" data-slot="5">5</div>
			<div class="hot-slot" data-slot="6">6</div>
			<div class="hot-slot" data-slot="7">7</div>
			<div class="hot-slot" data-slot="8">8</div>
			<div class="hot-slot" data-slot="9">9</div>
		</div>
	</div>
	<script>
		// Code edits will erase the world.
		// Place save code here to load your world. Make extra sure you got it copied so you don't paste in the wrong thing and delete your world on accident lol
		var loadString = ""
	</script>
	<script type="x-shader/vertex" id="blockVertexShader">
		attribute vec3  aVertex;
		attribute vec2  aTexture;
		attribute float aShadow;
		varying vec2  vTexture;
		varying float vShadow;
		varying float vFog;
		uniform mat4 uView;
		uniform float uDist;
		uniform vec3 uPos;

		void main(void) {
			vTexture = aTexture;
			vShadow = aShadow > 0.0 ? aShadow : 1.0;
			gl_Position = uView * vec4( aVertex, 1.0);

			float range = max(uDist / 5.0, 8.0);
			vFog = clamp((length(uPos.xz - aVertex.xz) - uDist + range) / range, 0.0, 1.0);
		}
	</script>
	<script type="x-shader/fragment" id="blockFragmentShader">
		#ifdef GL_FRAGMENT_PRECISION_HIGH
			precision highp float;
		#else
			precision mediump float;
		#endif

		uniform sampler2D uSampler;
		varying float vShadow;
		varying vec2 vTexture;
		varying float vFog;

		vec4 fog(vec4 color) {
			color.r += (0.33 - color.r) * vFog;
			color.g += (0.54 - color.g) * vFog;
			color.b += (0.72 - color.b) * vFog;
			return color;
		}

		void main(void){
			vec4 color = texture2D(uSampler, vTexture);
			gl_FragColor = fog(vec4(color.rgb * vShadow, color.a));
			if (gl_FragColor.a == 0.0) discard;
		}
	</script>
	<script type="x-shader/vertex" id="2dVertexShader">
		attribute vec2 aVertex;
		attribute vec2 aTexture;
		attribute float aShadow;
		varying vec2 vTexture;
		varying float vShadow;

		void main(void) {
			vTexture = aTexture;
			vShadow = aShadow;
			gl_Position = vec4(aVertex, 0.5, 1.0);
		}
	</script>
	<script type="x-shader/fragment" id="2dFragmentShader">
		#ifdef GL_FRAGMENT_PRECISION_HIGH
			precision highp float;
		#else
			precision mediump float;
		#endif

		uniform sampler2D uSampler;
		varying vec2 vTexture;
		varying float vShadow;

		void main(void) {
			vec4 color = texture2D(uSampler, vTexture);
			gl_FragColor = vec4(color.rgb * vShadow, color.a);
			if (gl_FragColor.a == 0.0) discard;
		}
	</script>
